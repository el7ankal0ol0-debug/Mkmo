<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>لو خيروني</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --rose: #ff5d8f;
    --rose-deep: #c81d5c;
    --gold: #ffd166;
    --cream: #fff6ef;
    --ink: #3a1730;
    --paper: #fbe8d3;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    font-family:'Tajawal', sans-serif;
    background: radial-gradient(circle at 30% 20%, #ffb4c6 0%, #ff5d8f 45%, #a3125e 100%);
    color: var(--ink);
    overflow:hidden;
  }
  #app{
    position:relative;
    width:100vw; height:100vh;
    display:flex; align-items:center; justify-content:center;
  }
  .screen{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:24px;
    opacity:0; pointer-events:none;
    transition: opacity .5s ease;
  }
  .screen.active{ opacity:1; pointer-events:auto; }

  /* ---------- SCREEN 1 : ENVELOPE ---------- */
  #envelope-wrap{ cursor:pointer; text-align:center; }
  .envelope{
    width:220px; height:150px;
    background: linear-gradient(#fff6ef,#ffe3ee);
    border-radius:10px;
    position:relative;
    margin:0 auto 26px;
    box-shadow: 0 20px 45px rgba(80,0,40,.45);
    transition: transform .35s ease;
  }
  .envelope:before{ /* bottom triangle */
    content:"";
    position:absolute; inset:0;
    background:
      linear-gradient(135deg, transparent 49.5%, #ffd0e0 50%),
      linear-gradient(-135deg, transparent 49.5%, #ffd0e0 50%);
    border-radius:10px;
  }
  .envelope-flap{
    position:absolute; top:0; left:0; right:0;
    height:0; width:0;
    border-left:110px solid transparent;
    border-right:110px solid transparent;
    border-top:80px solid var(--rose-deep);
    border-radius: 6px 6px 0 0;
    transform-origin: top;
    transition: transform .55s cubic-bezier(.6,-0.28,.74,.05);
    z-index:3;
  }
  .heart-seal{
    position:absolute; top:52px; left:50%; transform:translateX(-50%);
    font-size:30px; z-index:4; filter: drop-shadow(0 3px 4px rgba(0,0,0,.3));
    animation: pulse 1.4s infinite ease-in-out;
  }
  @keyframes pulse{ 0%,100%{transform:translateX(-50%) scale(1);} 50%{transform:translateX(-50%) scale(1.15);} }
  #envelope-wrap:hover .envelope{ transform: translateY(-6px); }
  #envelope-wrap.open .envelope-flap{ transform: rotateX(180deg); }
  .letter-peek{
    position:absolute; bottom:8px; left:50%; transform:translateX(-50%) translateY(0);
    width:180px; height:0px; background:#fffdf8; border-radius:6px 6px 0 0;
    box-shadow:0 -2px 8px rgba(0,0,0,.15);
    transition: height .5s ease .3s;
    z-index:2;
  }
  #envelope-wrap.open .letter-peek{ height:70px; }

  .hint{ color:#fff; font-size:18px; font-weight:700; text-shadow:0 2px 6px rgba(0,0,0,.35); }
  .title-top{
    font-family:'Lalezar', sans-serif;
    color:#fff; font-size:26px; margin-bottom:10px;
    text-shadow:0 3px 10px rgba(0,0,0,.35);
    letter-spacing:1px;
  }

  /* ---------- SCREEN 2 : QUESTION ---------- */
  #question-screen h1{
    font-family:'Lalezar', sans-serif;
    font-size: clamp(24px, 6vw, 40px);
    color:#fff;
    text-align:center;
    text-shadow: 0 4px 14px rgba(0,0,0,.4);
    margin: 0 0 8px;
  }
  #hint-text{
    color:#ffe9f1; font-size:14px; margin-bottom:22px; text-align:center; min-height:20px;
    font-weight:500;
  }
  #options-field{
    position:relative;
    width:min(560px, 92vw);
    height:min(430px, 62vh);
  }
  .opt-btn{
    position:absolute;
    border:none;
    border-radius:16px;
    padding:14px 22px;
    font-family:'Tajawal', sans-serif;
    font-weight:700;
    font-size: clamp(14px, 3.6vw, 18px);
    color:#fff;
    background: linear-gradient(135deg, var(--rose), var(--rose-deep));
    box-shadow: 0 10px 22px rgba(80,0,40,.4);
    cursor:pointer;
    white-space:nowrap;
    transition: top .28s cubic-bezier(.34,1.56,.64,1), left .28s cubic-bezier(.34,1.56,.64,1), transform .15s ease;
    touch-action:none;
    user-select:none;
  }
  .opt-btn:active{ transform:scale(.94); }
  .opt-btn.golden{
    background: linear-gradient(135deg, var(--gold), #ff8a5c);
    color:#3a1730;
    animation: golden-pop .6s ease, glow 1.6s infinite alternate;
    box-shadow: 0 0 0 rgba(255,209,102,0);
  }
  @keyframes golden-pop{ from{ transform:scale(0); opacity:0;} to{ transform:scale(1); opacity:1;} }
  @keyframes glow{ from{ box-shadow:0 10px 22px rgba(80,0,40,.4);} to{ box-shadow:0 10px 34px rgba(255,209,102,.9);} }

  #counter-wrap{
    margin-top: 18px;
    display:flex; gap:8px;
  }
  .pip{
    width:11px; height:11px; border-radius:50%;
    background: rgba(255,255,255,.35);
    transition: background .3s ease, transform .3s ease;
  }
  .pip.filled{ background:#fff; transform:scale(1.2); }

  /* ---------- SCREEN 3 : CELEBRATION ---------- */
  #celebration{
    background: radial-gradient(ellipse at 50% 30%, #6a1750 0%, #2c0a29 70%);
    overflow:hidden;
  }
  .venue{
    position:absolute; bottom:0; left:0; right:0; height:38%;
    background: linear-gradient(180deg, transparent, rgba(255,209,102,.18) 40%, rgba(255,209,102,.35));
  }
  .arch-deco{
    position:absolute; bottom:0; width:100%; height:100%;
    background-image:
      radial-gradient(circle at 15% 85%, rgba(255,93,143,.5) 0 6px, transparent 7px),
      radial-gradient(circle at 25% 92%, rgba(255,209,102,.5) 0 5px, transparent 6px),
      radial-gradient(circle at 80% 88%, rgba(255,93,143,.5) 0 6px, transparent 7px),
      radial-gradient(circle at 70% 95%, rgba(255,209,102,.5) 0 5px, transparent 6px),
      radial-gradient(circle at 45% 90%, rgba(255,93,143,.4) 0 5px, transparent 6px);
    background-repeat: repeat-x;
    background-size: 140px 140px;
    opacity:.9;
  }
  .couple-wrap{
    display:flex; align-items:flex-end; gap:6px;
    font-size: clamp(70px, 16vw, 110px);
    filter: drop-shadow(0 12px 20px rgba(0,0,0,.45));
    z-index:5;
    animation: enter-couple 1s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes enter-couple{ from{ transform: translateY(60px) scale(.6); opacity:0;} to{ transform:translateY(0) scale(1); opacity:1;} }
  .ring-emoji{
    font-size: clamp(22px, 5vw, 30px);
    align-self:center;
    animation: spin-ring 2.4s linear infinite;
  }
  @keyframes spin-ring{ from{transform:rotate(0);} to{transform:rotate(360deg);} }

  .congrats-text{
    font-family:'Lalezar', sans-serif;
    text-align:center;
    color:#fff;
    margin-top: 22px;
    z-index:5;
    text-shadow: 0 4px 18px rgba(255,93,143,.6), 0 0 40px rgba(255,209,102,.3);
  }
  .congrats-text .line1{ font-size: clamp(26px, 7vw, 46px); color:var(--gold); }
  .congrats-text .line2{ font-size: clamp(20px, 5vw, 30px); margin-top:6px; }

  #mute-btn{
    position:absolute; top:16px; left:16px; z-index:10;
    background: rgba(255,255,255,.15);
    border: 1px solid rgba(255,255,255,.4);
    color:#fff;
    width:42px; height:42px;
    border-radius:50%;
    font-size:18px;
    cursor:pointer;
    backdrop-filter: blur(4px);
  }

  .fall{
    position:fixed; top:-40px;
    pointer-events:none;
    animation-name: fall;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
    z-index:2;
  }
  @keyframes fall{
    0%{ transform: translateY(-10vh) translateX(0) rotate(0deg); opacity:1;}
    100%{ transform: translateY(110vh) translateX(var(--drift,0px)) rotate(360deg); opacity:.9;}
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration:.01ms !important; }
  }
</style>
</head>
<body>
<div id="app">

  <!-- SCREEN 1 -->
  <div class="screen active" id="envelope-screen">
    <div class="title-top">لِيك جواب مهم 💌</div>
    <div id="envelope-wrap">
      <div class="envelope">
        <div class="letter-peek"></div>
        <div class="envelope-flap"></div>
        <div class="heart-seal">💗</div>
      </div>
      <div class="hint">اضغطي على الظرف عشان تفتحيه</div>
    </div>
  </div>

  <!-- SCREEN 2 -->
  <div class="screen" id="question-screen">
    <h1>لو خيروني تتجوزي مين؟</h1>
    <div id="hint-text">جربي تختاري 😏</div>
    <div id="options-field"></div>
    <div id="counter-wrap"></div>
  </div>

  <!-- SCREEN 3 -->
  <div class="screen" id="celebration">
    <button id="mute-btn" aria-label="كتم الصوت">🔊</button>
    <div class="arch-deco"></div>
    <div class="couple-wrap">
      <span>🤵‍♂️</span>
      <span class="ring-emoji">💍</span>
      <span>👰‍♀️</span>
    </div>
    <div class="congrats-text">
      <div class="line1">مبـروك للعروسين 🎉</div>
      <div class="line2">محمد إسماعيل &amp; الآنسه ميرنا تامر جاد </div>
    </div>
    <div class="venue"></div>
  </div>

</div>

<script>
const envelopeWrap = document.getElementById('envelope-wrap');
const envelopeScreen = document.getElementById('envelope-screen');
const questionScreen = document.getElementById('question-screen');
const celebration = document.getElementById('celebration');
const optionsField = document.getElementById('options-field');
const counterWrap = document.getElementById('counter-wrap');
const hintText = document.getElementById('hint-text');

const normalOptions = [
  "بلال بدر 🤡",
  "محمد السيد 💩",
  "ابراهيم السيد 🤮",
  "الدكتور الخاطب 💉",
  "عبدالرحمن النطع"
];
const specialOption = "محمد إسماعيل المز الجامد اللي مفيش من أمه اتنين 😘";

let dodgeCount = 0;
const REQUIRED = 5;
let specialShown = false;

// build pips
for(let i=0;i<REQUIRED;i++){
  const p = document.createElement('div');
  p.className = 'pip';
  p.dataset.idx = i;
  counterWrap.appendChild(p);
}

function updatePips(){
  const pips = counterWrap.querySelectorAll('.pip');
  pips.forEach((p,i)=>{ p.classList.toggle('filled', i < dodgeCount); });
}

function randomPos(el){
  const fieldRect = optionsField.getBoundingClientRect();
  const w = el.offsetWidth || 150;
  const h = el.offsetHeight || 46;
  const maxX = Math.max(fieldRect.width - w, 10);
  const maxY = Math.max(fieldRect.height - h, 10);
  return {
    x: Math.random() * maxX,
    y: Math.random() * maxY
  };
}

function placeInitial(el, i, total){
  // spread initial buttons vertically so they don't overlap
  const fieldRect = optionsField.getBoundingClientRect();
  const h = fieldRect.height;
  const slot = h / total;
  el.style.left = (Math.random()*30 + 10) + '%';
  el.style.top = (slot*i + slot/2 - 23) + 'px';
}

function dodge(el){
  const pos = randomPos(el);
  el.style.left = pos.x + 'px';
  el.style.top = pos.y + 'px';
}

const hintPhrases = [
  "برضو حاولي تاني 😂",
  "شكله مش عايز يتمسك 🏃",
  "خيار واحد باقي و يظهر حد تاني...",
];

function handleDodgeAttempt(el){
  // dodging keeps happening for these buttons no matter what,
  // even after the special option has appeared
  dodge(el);
  if(!specialShown){
    dodgeCount = Math.min(dodgeCount+1, REQUIRED);
    updatePips();
    if(dodgeCount < REQUIRED){
      hintText.textContent = hintPhrases[Math.min(dodgeCount-1, hintPhrases.length-1)] || "جربي تختاري 😏";
    }
    if(dodgeCount >= REQUIRED){
      revealSpecial();
    }
  }
}

function revealSpecial(){
  specialShown = true;
  hintText.textContent = "طيب فيه خيار جديد ظهر 👀";
  const btn = document.createElement('button');
  btn.className = 'opt-btn golden';
  btn.textContent = specialOption;
  optionsField.appendChild(btn);
  // place it randomly within the field, same as the other options
  requestAnimationFrame(()=>{
    const pos = randomPos(btn);
    btn.style.left = pos.x + 'px';
    btn.style.top = pos.y + 'px';
  });
  btn.addEventListener('click', goToCelebration);
}

function goToCelebration(){
  questionScreen.classList.remove('active');
  celebration.classList.add('active');
  startFalling();
  playWeddingMusic();
}

/* ---------- Background wedding music (Web Audio API synth) ---------- */
let audioCtx = null;
let musicGain = null;
let musicMuted = false;
let musicTimer = null;

// "Here Comes the Bride" style motif (Wagner's Bridal Chorus opening), looped
const NOTE_FREQ = {
  'C4':261.63,'D4':293.66,'E4':329.63,'F4':349.23,'G4':392.00,
  'A4':440.00,'B4':493.88,'C5':523.25,'D5':587.33,'E5':659.25,'F5':698.46,'G5':783.99
};
const melody = [
  ['C4',0.6],['F4',0.3],['F4',0.3],['F4',0.3],['F4',0.3],['G4',0.6],['A4',0.6],
  ['F4',0.9],['E4',0.3],['E4',0.3],['E4',0.3],['E4',0.3],['F4',0.6],['E4',0.3],['D4',0.3],
  ['C4',1.2]
];

function playWeddingMusic(){
  if(musicMuted) return;
  try{
    if(!audioCtx){
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      musicGain = audioCtx.createGain();
      musicGain.gain.value = 0.12;
      musicGain.connect(audioCtx.destination);
    }
    if(audioCtx.state === 'suspended') audioCtx.resume();
    scheduleLoop();
  }catch(e){ /* audio not available, fail silently */ }
}

function scheduleLoop(){
  if(musicMuted || !audioCtx) return;
  let t = audioCtx.currentTime + 0.05;
  let total = 0;
  melody.forEach(([note, dur])=>{
    playNote(NOTE_FREQ[note], t, dur*0.92);
    t += dur;
    total += dur;
  });
  musicTimer = setTimeout(scheduleLoop, total * 1000);
}

function playNote(freq, startTime, duration){
  const osc = audioCtx.createOscillator();
  const noteGain = audioCtx.createGain();
  osc.type = 'triangle';
  osc.frequency.value = freq;
  noteGain.gain.setValueAtTime(0.0001, startTime);
  noteGain.gain.exponentialRampToValueAtTime(1, startTime + 0.04);
  noteGain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
  osc.connect(noteGain);
  noteGain.connect(musicGain);
  osc.start(startTime);
  osc.stop(startTime + duration + 0.05);
}

document.getElementById('mute-btn').addEventListener('click', ()=>{
  musicMuted = !musicMuted;
  document.getElementById('mute-btn').textContent = musicMuted ? '🔇' : '🔊';
  if(musicMuted){
    clearTimeout(musicTimer);
    if(audioCtx) audioCtx.suspend();
  } else {
    if(audioCtx){ audioCtx.resume(); }
    scheduleLoop();
  }
});

// Build the 4 dodging buttons
normalOptions.forEach((text, i)=>{
  const btn = document.createElement('button');
  btn.className = 'opt-btn';
  btn.textContent = text;
  optionsField.appendChild(btn);
  requestAnimationFrame(()=> placeInitial(btn, i, normalOptions.length));

  let dodged = false;
  const trigger = (e)=>{
    e.preventDefault();
    handleDodgeAttempt(btn);
  };
  btn.addEventListener('mouseenter', trigger);
  btn.addEventListener('touchstart', trigger, {passive:false});
  btn.addEventListener('click', trigger);
});

// Envelope open
envelopeWrap.addEventListener('click', ()=>{
  if(envelopeWrap.classList.contains('open')) return;
  envelopeWrap.classList.add('open');
  setTimeout(()=>{
    envelopeScreen.classList.remove('active');
    questionScreen.classList.add('active');
  }, 750);
});

// Falling hearts & flowers for celebration
function startFalling(){
  const emojis = ['💖','🌸','🌹','💐','✨','💗'];
  const container = document.getElementById('celebration');
  const count = 45;
  for(let i=0;i<count;i++){
    setTimeout(()=>{
      const el = document.createElement('div');
      el.className = 'fall';
      el.textContent = emojis[Math.floor(Math.random()*emojis.length)];
      const size = 14 + Math.random()*22;
      el.style.fontSize = size + 'px';
      el.style.left = Math.random()*100 + 'vw';
      el.style.setProperty('--drift', (Math.random()*160 - 80) + 'px');
      const dur = 5 + Math.random()*5;
      el.style.animationDuration = dur + 's';
      el.style.animationDelay = (Math.random()*2) + 's';
      container.appendChild(el);
    }, i * 120);
  }
  // keep spawning continuously
  setInterval(()=>{
    const el = document.createElement('div');
    el.className = 'fall';
    el.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    const size = 14 + Math.random()*22;
    el.style.fontSize = size + 'px';
    el.style.left = Math.random()*100 + 'vw';
    el.style.setProperty('--drift', (Math.random()*160 - 80) + 'px');
    el.style.animationDuration = (5 + Math.random()*5) + 's';
    container.appendChild(el);
    setTimeout(()=> el.remove(), 11000);
  }, 500);
}
</script>
</body>
</html>
